# provisioning-prc-api — PRODUCTION environment (CloudHub 2.0). Non-secret values only.
api:
  name: "provisioning-prc-api"
  version: "1.0.0"
  enforceClientSecret: "true"

http:
  port: "8081"

provisioning:
  requestTypes: "SETUP,DEACTIVATION"
  # Request types other than the ones above are IGNORED (outcome IGNORED_TYPE, INFO log; the row stays Requested).
  # Decision 7 Oct 2026: the old spelling PROVISIONING is NOT accepted anywhere; Salesforce Flows must publish SETUP.
  # legacyRequestTypes exists only as an emergency switch (comma-separated spellings processed as SETUP with a WARN); keep it empty.
  legacyRequestTypes: ""
  processableStatuses: "Requested,Retrying"
  retry:
    maxAttempts: "8"
    baseDelaySeconds: "120"
    maxDelaySeconds: "3600"
    schedulerFrequencyMinutes: "2"
  mappingFile: "mapping/provisioning-ticket.yaml"
  # ---- Scenario 1, Order model (requirements v3, 1 Oct 2026; Swati's answers 5 Oct 2026) ----
  # A SETUP row with Order__c set is handled per Order x product line from the Order Products (salesforce-sys-api
  # GET /orders/{id}); a row without Order__c keeps the Opportunity model above. Decided per row, no switch to flip.
  orderMappingFile: "mapping/setup-order-ticket.yaml"
  # Before creating, ask Jira for a ticket already carrying this request's label (same safety net as deactivation)
  duplicateCheck: "true"
  # Labels on every setup ticket: "<prefix>-<order id>-<line code>" and the bare prefix
  labelPrefix: "sf-setup"

# Scenario 2 — see config-dev.yaml for the meaning of each key. PRODUCTION targets per the requirements document:
# Neon CRM -> WORK "Deactivate Instance" (exists). FUND and ARTS do not exist yet (Neon One, 29 Sep 2026): "TBD" makes
# such a request fail terminally with a clear message on the Opportunity instead of creating a ticket in the wrong place.
deactivation:
  mappingFile: "mapping/deactivation-ticket.yaml"
  duplicateCheck: "true"
  labelPrefix: "sf-deact"
  missingDateText: "NOT SET - confirm the last paid day with the account manager before any shutdown"
  lines:
    NEON_CRM:
      project: "WORK"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "ncrmInstance"
      opportunityKey: "neonCrm"
      instanceLabel: "CRM Instance"
      summaryLabel: "CRM"
      summarySubject: "instanceId"
    NEON_FUNDRAISE:
      project: "TBD"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "rbId"
      opportunityKey: "neonFundraise"
      instanceLabel: "Customer Id"
      summaryLabel: "Fundraise"
      summarySubject: "accountName"
    ARTS_PEOPLE:
      project: "TBD"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "artsPeopleTheatreId"
      opportunityKey: "artsPeople"
      instanceLabel: "Theatre Id"
      summaryLabel: "Arts People"
      summarySubject: "accountName"


# Jira reporters by scenario and product line (Atlassian accountIds; requirements of 7 Oct 2026).
# Resolution per request: reporters.<scenario>.lines.<LINE_CODE> -> reporters.<scenario>.default -> none (Jira uses the API account).
# Setting a reporter requires (a) the Reporter field on the issue type's CREATE SCREEN in that project — jira-sys-api drops the
# field where the screen lacks it (today: WORK / Deactivate Instance) — and (b) "Modify Reporter" for the API account in the project.
# Every value here can be overridden per environment as a Runtime Manager property (same key), no rebuild needed.
reporters:
  setup:
    # System Setup tickets. PROD: NEON_CRM = Natalie Newendyke. Fundraise / Arts People setup reporters are not decided yet
    # (candidate for Arts People per the 7 Oct document: Darla DeMontesquiou 6363dcc859c794184bcc56fc); blank = fall back to default/API account.
    default: ""
    lines:
      NEON_CRM: "60a27983391e56006e52cca8"
      NEON_FUNDRAISE: ""
      ARTS_PEOPLE: ""
  deactivation:
    # Deactivate Instance tickets, all product lines. PROD: Chelsea Diehl.
    default: "613b80a0156ab30071a232b8"
    lines:
      NEON_CRM: ""
      NEON_FUNDRAISE: ""
      ARTS_PEOPLE: ""

jira:
  project: "SETUP"                   # Production project "New System Setups" (id 10902)
  instanceReadyStatusId: "10805"
  issueTypeNames:
    SYSTEM_SETUP: "System Setup"
    DEACTIVATE_INSTANCE: "Deactivate Instance"
  statusCategoryMap:
    new: "To Do"
    indeterminate: "In Progress"
    done: "Done"
    undefined: "To Do"

inbound:
  createRowForUnknownKeys: "false"
  sweep:
    enabled: "true"
    frequencyMinutes: "60"
    limit: "500"

sf:
  baseUrl: "REPLACE_ME_https://neonone.lightning.force.com"

sysSf:
  protocol: "HTTPS"
  host: "REPLACE_ME_salesforce-sys-api-prod.cloudhub.io"
  port: "443"
  basePath: "/api/v1"
  responseTimeoutMs: "30000"
sysJira:
  protocol: "HTTPS"
  host: "REPLACE_ME_jira-sys-api-prod.cloudhub.io"
  port: "443"
  basePath: "/api/v1"
  responseTimeoutMs: "45000"
