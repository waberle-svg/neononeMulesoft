# provisioning-prc-api — UAT environment (CloudHub 2.0). Non-secret values only. REPLACE_ME values are filled at first deployment.
api:
  name: "provisioning-prc-api"
  version: "1.0.0"
  enforceClientSecret: "true"

http:
  port: "8081"

provisioning:
  requestTypes: "PROVISIONING,DEACTIVATION"
  processableStatuses: "Requested,Retrying"
  retry:
    maxAttempts: "6"
    baseDelaySeconds: "60"
    maxDelaySeconds: "3600"
    schedulerFrequencyMinutes: "1"
  mappingFile: "mapping/provisioning-ticket.yaml"

# Scenario 2 — see config-dev.yaml for the meaning of each key. UAT = project WOU "Work Orders - UAT" (Neon One's test
# copy of WORK) with the real Deactivate Instance type, for all three lines (Swati, 1 Oct 2026).
deactivation:
  mappingFile: "mapping/deactivation-ticket.yaml"
  duplicateCheck: "true"
  labelPrefix: "sf-deact"
  missingDateText: "NOT SET - confirm the last paid day with the account manager before any shutdown"
  lines:
    NEON_CRM:
      project: "WOU"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "ncrmInstance"
      opportunityKey: "neonCrm"
      instanceLabel: "CRM Instance"
      summaryLabel: "CRM"
      summarySubject: "instanceId"
    NEON_FUNDRAISE:
      project: "WOU"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "rbId"
      opportunityKey: "neonFundraise"
      instanceLabel: "Customer Id"
      summaryLabel: "Fundraise"
      summarySubject: "accountName"
    ARTS_PEOPLE:
      project: "WOU"
      issueType: "DEACTIVATE_INSTANCE"
      instanceField: "artsPeopleTheatreId"
      opportunityKey: "artsPeople"
      instanceLabel: "Theatre Id"
      summaryLabel: "Arts People"
      summarySubject: "accountName"

jira:
  project: "NSSU"
  instanceReadyStatusId: "10805"
  issueTypeNames:
    SYSTEM_SETUP: "System Setup"
    DEACTIVATE_INSTANCE: "Deactivate Instance"
  statusCategoryMap:
    new: "To Do"
    indeterminate: "In Progress"
    done: "Done"
    undefined: "To Do"

inbound:
  createRowForUnknownKeys: "false"
  sweep:
    enabled: "true"
    frequencyMinutes: "60"
    limit: "200"

sf:
  baseUrl: "REPLACE_ME_https://neonone--uat.sandbox.lightning.force.com"

sysSf:
  protocol: "HTTPS"
  host: "REPLACE_ME_salesforce-sys-api-uat.cloudhub.io"
  port: "443"
  basePath: "/api/v1"
  responseTimeoutMs: "30000"
sysJira:
  protocol: "HTTPS"
  host: "REPLACE_ME_jira-sys-api-uat.cloudhub.io"
  port: "443"
  basePath: "/api/v1"
  responseTimeoutMs: "45000"
